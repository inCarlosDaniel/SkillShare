
<!doctype html>


<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

  <head>

    
    <meta charset="UTF-8" />

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    
    <title>Chat - SkillShare</title>

    
    <link rel="stylesheet" href="/css/base.css" />

    
    <link rel="stylesheet" href="/css/mensagens.css" />

    
    <link rel="stylesheet" href="/css/barra-topo.css" />

    
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

    
    <script src="/js/chat.js" defer></script>

  </head>

  <body>

    <!-- Chat: conversa direta com outro usuario usando historico, WebSocket e indicador de presenca. -->

    

    
    <div id="chatData" hidden
         th:attr="data-dest-id=${destinatario != null ? destinatario.idUsuario : 0},
                  data-dest-nome=${destinatario != null ? destinatario.nome : 'Usuario'},
                  data-current-email=${currentUser != null ? currentUser.email : ''},
                  data-current-nome=${currentUser != null ? currentUser.nome : ''}">

    </div>

    
    <div class="messages-window">


      
      <header th:replace="~{fragments/topbar :: top-bar('')}"></header>

      
      <main class="chat-shell">

        
        <header class="chat-header">

          
          <a class="back-button" href="/mensagens-lista" aria-label="Voltar para mensagens">&#8592;</a>

          
          <span class="chat-avatar-stack">
            
            <span class="conversation-avatar conv-placeholder" id="chatHeaderAvatarFallback"
                  th:text="${destinatario != null ? #strings.substring(destinatario.nome, 0, 1) : 'U'}">U</span>
            
            <img class="conversation-avatar conv-foto js-profile-photo"
                 th:src="@{/usuarios/{id}/foto(id=${destinatario != null ? destinatario.idUsuario : 0})}"
                 th:alt="${destinatario != null ? destinatario.nome : 'Usuario'}"
                 data-placeholder-id="chatHeaderAvatarFallback" />
          </span>

          <div>

            
            <h1 th:text="${destinatario != null ? destinatario.nome : 'Usuario'}">Usuario</h1>

            
            <p><span class="online-dot" id="onlineDot"></span> <span id="statusTexto">Verificando...</span></p>

          </div>

        </header>

        

        
        <div class="conexao-banner" th:if="${conexaoPendente != null}"
             style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fff8e1;border-bottom:2px solid #ffc107;font-size:14px;">

          
          <p style="margin:0;">
            
            <strong th:text="${destinatario.nome}">Usuario</strong> quer se conectar com voce
          </p>

          
          <div style="display:flex;gap:8px;">

            
            <form th:action="@{/conexao/{id}/aceitar(id=${conexaoPendente.idMensagem})}" method="post" style="margin:0;">

              
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              
              <button type="submit"
                      style="padding:7px 16px;background:#4caf50;color:#fff;border:0;border-radius:999px;font-weight:700;cursor:pointer;">
                &#10003; Aceitar
              </button>

            </form>

            
            <form th:action="@{/conexao/{id}/recusar(id=${conexaoPendente.idMensagem})}" method="post" style="margin:0;">

              
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              
              <button type="submit"
                      style="padding:7px 16px;background:#f44336;color:#fff;border:0;border-radius:999px;font-weight:700;cursor:pointer;">
                &#10005; Recusar
              </button>

            </form>

          </div>

        </div>

        
        <section class="chat-thread" id="chatThread" aria-label="Conversa">

          

          
          <th:block th:each="mensagem, iter : ${mensagens}">

            
            <div th:classappend="${currentUser != null && mensagem.remetente != null && mensagem.remetente.idUsuario == currentUser.idUsuario} ? 'bubble-row sent' : 'bubble-row received'">

              
              <span class="chat-avatar-stack chat-avatar-stack-small"
                    th:if="${currentUser == null || mensagem.remetente == null || mensagem.remetente.idUsuario != currentUser.idUsuario}"
                    th:with="remetenteId=${mensagem.remetente != null ? mensagem.remetente.idUsuario : 0},
                             avatarId=${'msg-avatar-' + iter.index}">
                
                <span class="bubble-avatar" th:id="${avatarId}"
                      th:text="${mensagem.remetente != null ? #strings.substring(mensagem.remetente.nome, 0, 1) : 'U'}">U</span>
                
                <img class="bubble-avatar bubble-foto js-profile-photo"
                     th:src="@{/usuarios/{id}/foto(id=${remetenteId})}"
                     th:alt="${mensagem.remetente != null ? mensagem.remetente.nome : 'Usuario'}"
                     th:attr="data-placeholder-id=${avatarId}" />
              </span>

              
              <article class="chat-bubble"
                       th:classappend="${currentUser != null && mensagem.remetente != null && mensagem.remetente.idUsuario == currentUser.idUsuario} ? ' sent' : ' received'">

                
                <p th:text="${mensagem.texto}">Mensagem</p>

                
                <time th:datetime="${mensagem.dataEnvio}"
                      th:text="${mensagem.dataEnvio != null ? #temporals.format(mensagem.dataEnvio, 'HH:mm') : ''}">10:32</time>

              </article>

            </div>

          </th:block>

          
          <div class="bubble-row received" th:if="${#lists.isEmpty(mensagens)}">

            
            <article class="chat-bubble received">

              <p>Nenhuma mensagem ainda. Diga ola!</p>

              <time>Agora</time>

            </article>

          </div>

          

          
          <div id="typingIndicator" class="bubble-row received" hidden>

            
            <span class="chat-avatar-stack chat-avatar-stack-small">
              
              <span class="bubble-avatar" id="typingAvatar"
                    th:text="${destinatario != null ? #strings.substring(destinatario.nome, 0, 1) : 'U'}">U</span>
              
              <img class="bubble-avatar bubble-foto js-profile-photo"
                   th:src="@{/usuarios/{id}/foto(id=${destinatario != null ? destinatario.idUsuario : 0})}"
                   th:alt="${destinatario != null ? destinatario.nome : 'Usuario'}"
                   data-placeholder-id="typingAvatar" />
            </span>

            
            <div class="typing-indicator">

              <span></span><span></span><span></span>

            </div>

          </div>

        </section>

        

        
        <div th:if="${conexaoPendente != null}"
             style="padding:14px 20px;text-align:center;color:#888;font-size:13px;border-top:1px solid #edf0f5;">
          Aceite a solicitacao acima para responder.
        </div>

        

        
        <form class="chat-compose" id="chatForm" th:if="${conexaoPendente == null}"
              th:action="@{/chat/{id}(id=${destinatario != null ? destinatario.idUsuario : 0})}"
              method="post">

          
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          
          <div style="position:relative;flex:1;display:flex;flex-direction:column;gap:4px;">

            
            <input type="text" id="chatInput" name="texto"
                   placeholder="Digite sua mensagem... (Enter para enviar)"
                   aria-label="Digite sua mensagem" required autocomplete="off" />

            
            <span id="chatContador" style="font-size:11px;color:#a0a7b8;text-align:right;"></span>

          </div>

          
          <button type="submit" aria-label="Enviar mensagem">&#10148;</button>

        </form>

        
        <button id="btnRolarFim"
                style="display:none;position:fixed;bottom:90px;right:28px;min-height:36px;padding:0 16px;border-radius:999px;background:#4169dc;color:#fff;font-size:13px;font-weight:800;border:0;cursor:pointer;box-shadow:0 6px 14px rgba(65,105,220,.3);"
                aria-label="Rolar para as mensagens mais recentes">

          &#8595; Novas mensagens
        </button>

      </main>

    </div>

    
    <th:block th:replace="~{fragments/topbar :: chat-widget}"></th:block>

    
    <th:block th:replace="~{fragments/topbar :: vlibras}"></th:block>

  </body>

</html>
