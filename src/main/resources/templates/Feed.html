<!doctype html>


<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

  <head>

    
    <meta charset="UTF-8" />

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    
    <title>Feed - SkillShare</title>

    
    <link rel="stylesheet" href="/css/base.css" />

    
    <link rel="stylesheet" href="/css/feed.css" />

    
    <link rel="stylesheet" href="/css/barra-topo.css" />

    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

    
    <script src="/js/feed.js" defer></script>

  </head>

  <body>

    <!-- Feed: permite criar postagens, anexar arquivos, comentar e votar nas publicacoes. -->

    
    <div class="feed-window">


      
      <header th:replace="~{fragments/topbar :: top-bar('feed')}"></header>

      
      <main class="feed-shell">

        

        
        <div th:if="${erro}" class="flash-sucesso" style="background:#fff0f0;color:#e53935;border-color:#f5c0c0;">

          
          ⚠ <span th:text="${erro}">Erro</span>

        </div>

        
        <div th:if="${erroAnexo}" class="flash-sucesso" style="background:#fff8e1;color:#e57800;border-color:#ffd54f;">

          
          📎 <span th:text="${erroAnexo}">Erro no anexo</span>

        </div>

        

        
        <form class="composer-card" action="/feed" method="post" enctype="multipart/form-data" aria-label="Criar postagem">

          
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          
          <textarea class="composer-input" name="conteudo"
                    placeholder="Compartilhe uma dúvida ou material de estudo com a comunidade..."
                    aria-label="Texto da postagem" required></textarea>

          
          <input type="file" id="feedFileInput" name="arquivo" style="display:none;" />

          
          <span id="feedFileName" style="font-size:13px;color:#666;margin-left:8px;"></span>

          
          <div class="composer-actions">

            
            <button class="attachment-button" type="button"
                    onclick="document.getElementById('feedFileInput').click()">

              
              <span class="attachment-icon" aria-hidden="true"></span>

              Adicionar Anexo
            </button>

            
            <button class="publish-button" type="submit">+ Criar Post</button>

          </div>

        </form>

        

        
        <nav class="feed-abas" aria-label="Filtrar postagens">

          
          <a th:href="@{/feed}" class="feed-aba" th:classappend="${!abaMinhas} ? ' ativa' : ''">

            Todas as Postagens
          </a>

          
          <a th:href="@{/feed(minhas=true)}" class="feed-aba" th:classappend="${abaMinhas} ? ' ativa' : ''">

            Minhas Postagens
          </a>

        </nav>

        

        
        <section class="posts-list" aria-label="Postagens">

          
          <article class="post-card"
                   th:each="postagem : ${postagens}"
                   th:attr="data-post-id=${postagem.getidPostagem()},data-upvote-count=${postagem.upvoteCount},data-dono=${currentUser != null and postagem.autor != null and postagem.autor.idUsuario == currentUser.idUsuario}">

            
            <header class="post-header">

              
              <div style="display:flex;align-items:center;gap:12px;">

                

                
                <a th:href="@{/usuario/{id}(id=${postagem.autor != null ? postagem.autor.idUsuario : 0})}"
                   class="post-autor-avatar-link">

                  
                  <span class="post-autor-avatar"
                        data-default-profile-avatar="true"
                        th:text="${postagem.autor != null ? #strings.substring(postagem.autor.nome, 0, 1) : 'U'}"
                        th:id="'post-av-placeholder-' + ${postagem.getidPostagem()}"
                        style="display:grid;">U</span>

                  
                  
                  
                  <img class="post-autor-avatar"
                       th:id="'post-av-img-' + ${postagem.getidPostagem()}"
                       th:src="@{/usuarios/{id}/foto(id=${postagem.autor != null ? postagem.autor.idUsuario : 0})}"
                       th:alt="${postagem.autor != null ? postagem.autor.nome : ''}"
                       style="display:none;object-fit:cover;"
                       th:onerror="'this.style.display=\'none\';var p=document.getElementById(\'post-av-placeholder-\'+' + ${postagem.getidPostagem()} + ');if(window.SkillShareAvatars){window.SkillShareAvatars.showDefault(p);}else if(p){p.style.display=\'grid\';}'"
                       th:onload="'this.style.display=\'block\';var p=document.getElementById(\'post-av-placeholder-\'+' + ${postagem.getidPostagem()} + ');if(p)p.style.display=\'none\';'" />

                </a>

                
                <div>

                  
                  <h1 th:text="${postagem.autor != null ? postagem.autor.nome : 'Usuário'}">Usuário</h1>

                  
                  <span class="post-skill"
                        th:text="${postagem.autor != null && postagem.autor.habilidades != null && !#strings.isEmpty(postagem.autor.habilidades) ? postagem.autor.habilidades : 'SkillShare'}">

                    SkillShare
                  </span>

                </div>

              </div>

              
              <div style="display:flex;align-items:center;gap:8px;">

                
                <time th:datetime="${postagem.dataPublicacao}"
                      th:text="${postagem.dataPublicacao != null ? #temporals.format(postagem.dataPublicacao, 'dd/MM HH:mm') : 'Agora'}">

                  Agora
                </time>

                

                
                <div class="post-menu" x-data="{ aberto: false }"
                     th:if="${currentUser != null && postagem.autor != null && postagem.autor.idUsuario == currentUser.idUsuario}">

                  
                  <button class="post-menu-btn" type="button" @click="aberto = !aberto"
                          aria-label="Opções do post">⋯</button>

                  
                  <div class="post-menu-dropdown" x-show="aberto" @click.outside="aberto = false" x-transition>

                    
                    <button class="post-menu-item post-edit-btn" type="button">✏️ Editar</button>

                    
                    <button class="post-menu-item post-delete-btn" type="button">🗑️ Excluir</button>

                  </div>

                </div>

              </div>

            </header>

            
            <p class="post-conteudo" th:text="${postagem.conteudo}">Conteudo da postagem</p>

            

            
            <th:block th:if="${postagem.anexos != null and not #lists.isEmpty(postagem.anexos)}">

              
              <a class="file-chip"
                 th:each="anexo : ${postagem.anexos}"
                 th:href="${anexo.url}"
                 th:aria-label="${'Baixar ' + anexo.nomeArquivo}">

                
                <span class="file-icon" aria-hidden="true"></span>

                
                <span th:text="${anexo.nomeArquivo}">Arquivo</span>

              </a>

            </th:block>

            

            
            <footer class="post-footer">

              
              <button class="upvote-button upvote-btn" type="button" title="Upvote">

                
                <span class="upvote-icon" aria-hidden="true"></span>

                
                <span class="upvote-count">Upvote</span>

              </button>

              
              <button class="comentarios-btn" type="button" title="Ver comentários">

                
                <span>💬</span>

                
                <span class="comentarios-count">0</span>

              </button>

            </footer>

            

            
            <section class="comentarios-section" hidden>

              
              <div class="comentarios-lista"></div>

              
              <form class="comentario-form">

                
                <input type="text" class="comentario-input"
                       placeholder="Adicionar comentário..." maxlength="300" required />

                
                <button type="submit" class="comentario-enviar" aria-label="Enviar comentário">↩</button>

              </form>

            </section>

          </article>

          
          <article class="post-card post-card-vazio" th:if="${#lists.isEmpty(postagens)}">

            
            <p th:text="${abaMinhas ? 'Você ainda não publicou nenhuma postagem.' : 'Nenhuma postagem cadastrada ainda.'}">

              Nenhuma postagem.
            </p>

          </article>

        </section>

      </main>

    </div>

    
    <th:block th:replace="~{fragments/topbar :: chat-widget}"></th:block>

    
    <th:block th:replace="~{fragments/topbar :: vlibras}"></th:block>

  </body>

</html>
