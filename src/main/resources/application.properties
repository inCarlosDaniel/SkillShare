#Database, JPA / Hibernate:

# Define o nome da aplicacao dentro do Spring Boot
spring.application.name=SkillShare 

# Define o endereco do banco MariaDB, incluindo host, porta e nome do banco
spring.datasource.url=jdbc:mariadb://localhost:3306/skillshare?maxAllowedPacket=67108864

# Aumenta o max_allowed_packet no servidor MariaDB ao abrir cada conexão do pool.
# Necessário para uploads de arquivos grandes (PDFs, imagens).
spring.datasource.hikari.connection-init-sql=SET GLOBAL max_allowed_packet=67108864

# Define o usuario usado para conectar no banco de dados
spring.datasource.username=root

# Define a senha do usuario do banco, vazio significa sem senha
spring.datasource.password=

# Define o driver JDBC usado para conectar no MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Flyway gerencia o schema; Hibernate apenas valida as entidades contra o banco
spring.jpa.hibernate.ddl-auto=validate

# Configura as migrations do Flyway
spring.flyway.enabled=false

# Mantem os nomes das tabelas e colunas iguais aos definidos nas entidades
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Habilita conversao de _method=DELETE/PUT em formularios HTML
spring.mvc.hiddenmethod.filter.enabled=true

# File upload:

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Email:
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2:
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Garante que o principal OAuth2 use e-mail (consistente com form login)
spring.security.oauth2.client.provider.google.user-name-attribute=email

# Chave AES-256 para criptografia de mensagens (32 bytes em Base64)
app.mensagem.chave-aes=${APP_MENSAGEM_CHAVE_AES}

# GitHub OAuth2:
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
